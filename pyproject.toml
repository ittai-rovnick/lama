[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lama-exchange"
version = "1.0.0"
description = "LAMA^AI Loan Exchange Service - Match loan applications with eligible lenders"
readme = "docs/README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [
    {name = "LAMA^AI Inc.", email = "info@lama.ai"}
]
keywords = ["loans", "lending", "matching", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Documentation = "https://github.com/lama-ai/loan-exchange"
Repository = "https://github.com/lama-ai/loan-exchange"
Issues = "https://github.com/lama-ai/loan-exchange/issues"

[tool.setuptools]
packages = ["lama", "lama.models", "lama.constraints", "lama.repository", "lama.services", "lama.config", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
