<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAMA^AI Loan Exchange - Find Your Perfect Lender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.95;
            font-weight: 300;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            animation: slideUp 0.6s ease-out;
        }

        @media (max-width: 900px) {
            .content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }
        }

        .form-section {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .form-section h2 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="text"]:disabled,
        input[type="number"]:disabled,
        select:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .range-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #764ba2;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.6);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
            transition: all 0.2s ease;
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: #764ba2;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.6);
        }

        .risk-value {
            display: inline-block;
            min-width: 50px;
            text-align: center;
            font-weight: 600;
            color: #667eea;
            font-size: 1.1rem;
        }

        .income-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .results-section {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .results-content {
            width: 100%;
        }

        .results-section h2 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #666;
            font-size: 1rem;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .empty-state-title {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .empty-state-text {
            color: #999;
            line-height: 1.6;
        }

        .error-alert {
            background-color: #fee;
            border-left: 4px solid #f66;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .error-title {
            color: #c33;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .error-message {
            color: #666;
        }

        .banks-grid {
            display: grid;
            gap: 15px;
        }

        .bank-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            animation: slideIn 0.4s ease-out forwards;
            opacity: 0;
        }

        .bank-card:nth-child(1) { animation-delay: 0s; }
        .bank-card:nth-child(2) { animation-delay: 0.1s; }
        .bank-card:nth-child(3) { animation-delay: 0.2s; }
        .bank-card:nth-child(4) { animation-delay: 0.3s; }
        .bank-card:nth-child(5) { animation-delay: 0.4s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .bank-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .bank-icon {
            font-size: 2.5rem;
            opacity: 0.9;
        }

        .bank-info h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .bank-info p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .no-results {
            text-align: center;
        }

        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .no-results-title {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .no-results-text {
            color: #999;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        .initial-state {
            text-align: center;
            color: #999;
        }

        .initial-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .initial-title {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .initial-text {
            color: #999;
            line-height: 1.6;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .api-url-input {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-top: 20px;
            color: #666;
        }

        .api-url-label {
            display: block;
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .examples-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .examples-title {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .examples-grid {
            display: grid;
            gap: 10px;
        }

        .example-btn {
            width: 100%;
            padding: 12px 15px;
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .example-btn:hover {
            background: #e8e8ff;
            border-color: #667eea;
            color: #667eea;
            transform: translateX(4px);
        }

        .example-btn-label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .example-btn-desc {
            display: block;
            font-size: 0.85rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 LAMA^AI Loan Exchange</h1>
            <p class="subtitle">Find the perfect lender for your loan application in seconds</p>
        </header>

        <div class="content">
            <!-- FORM SECTION -->
            <div class="form-section">
                <h2>Application Details</h2>
                <form id="loanForm">
                    <!-- Borrower Type -->
                    <div class="form-group">
                        <label for="borrowerType">Borrower Type *</label>
                        <select id="borrowerType" name="borrowerType" required>
                            <option value="consumer" selected>Consumer</option>
                            <option value="business">Business</option>
                        </select>
                    </div>

                    <!-- Loan Type -->
                    <div class="form-group">
                        <label for="loanType">Loan Type *</label>
                        <select id="loanType" name="loanType" required>
                            <option value="Student Loan" selected>Student Loan</option>
                            <option value="Line Of Credit">Line Of Credit</option>
                            <option value="Equipment Financing">Equipment Financing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- Requested Amount -->
                    <div class="form-group">
                        <label for="requestedAmount">Requested Amount ($) *</label>
                        <input type="number" id="requestedAmount" name="requestedAmount"
                               value="30000" required min="0" step="100">
                    </div>

                    <!-- State -->
                    <div class="form-group">
                        <label for="state">State (2-letter code) *</label>
                        <input type="text" id="state" name="state"
                               value="CA" required maxlength="2" placeholder="e.g., CA, NY">
                    </div>

                    <!-- Risk Level -->
                    <div class="form-group">
                        <label for="riskLevel">Risk Level (1-100) *</label>
                        <div class="range-container">
                            <input type="range" id="riskLevel" name="riskLevel"
                                   min="1" max="100" value="75" required>
                            <span class="risk-value" id="riskValue">75</span>
                        </div>
                    </div>

                    <!-- Income -->
                    <div class="form-group">
                        <label>Annual Income *</label>
                        <div class="income-group">
                            <div>
                                <label for="currentYearIncome" style="font-weight: 500; margin-bottom: 5px;">Current Year ($)</label>
                                <input type="number" id="currentYearIncome" name="currentYearIncome"
                                       value="20000" required min="0" step="100">
                            </div>
                            <div>
                                <label for="previousYearIncome" style="font-weight: 500; margin-bottom: 5px;">Previous Year ($)</label>
                                <input type="number" id="previousYearIncome" name="previousYearIncome"
                                       value="25000" required min="0" step="100">
                            </div>
                        </div>
                    </div>

                    <!-- Industry -->
                    <div class="form-group">
                        <label for="industry">Industry (Business Only)</label>
                        <input type="text" id="industry" name="industry"
                               placeholder="e.g., Restaurant, Agriculture" disabled>
                    </div>

                    <!-- Number of Banks to Display -->
                    <div class="form-group">
                        <label for="bankLimit">Number of Banks to Display</label>
                        <input type="number" id="bankLimit" name="bankLimit"
                               value="2" min="1" max="100" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn">Find Matching Banks</button>

                    <!-- Quick Examples -->
                    <div class="examples-section">
                        <div class="examples-title">📋 Quick Examples</div>
                        <div class="examples-grid">
                            <button type="button" class="example-btn" id="example1Btn">
                                <span class="example-btn-label">Example 1: No Matches</span>
                                <span class="example-btn-desc">Business, Line of Credit, NY, High Risk</span>
                            </button>
                            <button type="button" class="example-btn" id="example2Btn">
                                <span class="example-btn-label">Example 2: Filtered Selection</span>
                                <span class="example-btn-desc">Consumer, Student Loan, CA, Risk 75</span>
                            </button>
                            <button type="button" class="example-btn" id="example3Btn">
                                <span class="example-btn-label">Example 3: Priority Sorting</span>
                                <span class="example-btn-desc">Consumer, Student Loan, CA, Risk 55</span>
                            </button>
                        </div>
                    </div>

                    <!-- API URL Configuration -->
                    <div class="api-url-input">
                        <span class="api-url-label">API Endpoint:</span>
                        <input type="text" id="apiUrl" value="http://localhost:8000/match"
                               style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem;">
                    </div>
                </form>
            </div>

            <!-- RESULTS SECTION -->
            <div class="results-section">
                <div class="results-content" id="resultsContent">
                    <div class="initial-state">
                        <div class="initial-icon">🎯</div>
                        <div class="initial-title">Ready to Find Lenders</div>
                        <div class="initial-text">Fill in your loan details and click "Find Matching Banks" to discover lenders that match your profile.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loanForm');
        const borrowerTypeSelect = document.getElementById('borrowerType');
        const industryInput = document.getElementById('industry');
        const riskLevelInput = document.getElementById('riskLevel');
        const riskValueSpan = document.getElementById('riskValue');
        const submitBtn = document.getElementById('submitBtn');
        const resultsContent = document.getElementById('resultsContent');
        const apiUrlInput = document.getElementById('apiUrl');

        // Update risk level display
        riskLevelInput.addEventListener('input', (e) => {
            riskValueSpan.textContent = e.target.value;
        });

        // Toggle industry field based on borrower type
        borrowerTypeSelect.addEventListener('change', (e) => {
            const isBusiness = e.target.value === 'business';
            industryInput.disabled = !isBusiness;
            if (!isBusiness) {
                industryInput.value = '';
            }
        });

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Show loading state
            submitBtn.disabled = true;
            resultsContent.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">Searching for matching lenders...</div>
                </div>
            `;

            try {
                // Gather form data
                const formData = {
                    borrowerType: document.getElementById('borrowerType').value,
                    loanType: document.getElementById('loanType').value,
                    requestedAmount: parseFloat(document.getElementById('requestedAmount').value),
                    state: document.getElementById('state').value,
                    riskLevel: parseInt(document.getElementById('riskLevel').value),
                    currentYearIncome: parseFloat(document.getElementById('currentYearIncome').value),
                    previousYearIncome: parseFloat(document.getElementById('previousYearIncome').value),
                };

                // Add industry if borrower is business
                if (formData.borrowerType === 'business') {
                    formData.industry = document.getElementById('industry').value;
                }

                // Validate inputs
                if (formData.requestedAmount < 0) {
                    throw new Error('Requested amount cannot be negative');
                }
                if (formData.riskLevel < 1 || formData.riskLevel > 100) {
                    throw new Error('Risk level must be between 1 and 100');
                }
                if (formData.currentYearIncome < 0 || formData.previousYearIncome < 0) {
                    throw new Error('Income values cannot be negative');
                }
                if (!formData.state || formData.state.length !== 2) {
                    throw new Error('State must be a 2-letter code');
                }

                // Make API request
                const bankLimit = parseInt(document.getElementById('bankLimit').value);
                const apiUrl = apiUrlInput.value.trim();
                const urlWithLimit = `${apiUrl}?limit=${bankLimit}`;
                const response = await fetch(urlWithLimit, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status} ${response.statusText}`);
                }

                const banks = await response.json();

                // Display results
                if (banks.length === 0) {
                    resultsContent.innerHTML = `
                        <div class="no-results">
                            <div class="no-results-icon">🔍</div>
                            <div class="no-results-title">No Matching Lenders Found</div>
                            <div class="no-results-text">
                                Unfortunately, we couldn't find lenders that match your specific financial profile.
                                Try adjusting your loan parameters and try again.
                            </div>
                        </div>
                    `;
                } else {
                    const banksHTML = banks.map((bank, index) => `
                        <div class="bank-card">
                            <div class="bank-icon">🏦</div>
                            <div class="bank-info">
                                <h3>${escapeHtml(bank)}</h3>
                                <p>Approved for your loan application</p>
                            </div>
                        </div>
                    `).join('');

                    resultsContent.innerHTML = `
                        <h2>✨ Matching Lenders (${banks.length})</h2>
                        <div class="banks-grid">
                            ${banksHTML}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                resultsContent.innerHTML = `
                    <div class="error-alert">
                        <div class="error-title">❌ Error</div>
                        <div class="error-message">${escapeHtml(error.message)}</div>
                        <div class="error-message" style="margin-top: 8px; font-size: 0.9rem;">
                            Please check your backend connection and try again.
                        </div>
                    </div>
                `;
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Utility function to escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Set initial state
        industryInput.disabled = true;

        // Example data
        const examples = {
            example1: {
                borrowerType: "business",
                loanType: "Line Of Credit",
                state: "NY",
                riskLevel: 90,
                industry: "agriculture",
                requestedAmount: 1000000,
                currentYearIncome: 30000,
                previousYearIncome: 45000,
                bankLimit: 2
            },
            example2: {
                borrowerType: "consumer",
                loanType: "Student Loan",
                state: "CA",
                riskLevel: 75,
                requestedAmount: 30000,
                currentYearIncome: 20000,
                previousYearIncome: 25000,
                bankLimit: 2
            },
            example3: {
                borrowerType: "consumer",
                loanType: "Student Loan",
                state: "CA",
                riskLevel: 55,
                requestedAmount: 30000,
                currentYearIncome: 30000,
                previousYearIncome: 45000,
                bankLimit: 2
            }
        };

        // Function to load example data
        function loadExample(exampleKey) {
            const example = examples[exampleKey];
            if (!example) return;

            // Set form values
            document.getElementById('borrowerType').value = example.borrowerType;
            document.getElementById('loanType').value = example.loanType;
            document.getElementById('state').value = example.state;
            document.getElementById('riskLevel').value = example.riskLevel;
            document.getElementById('requestedAmount').value = example.requestedAmount;
            document.getElementById('currentYearIncome').value = example.currentYearIncome;
            document.getElementById('previousYearIncome').value = example.previousYearIncome;
            document.getElementById('bankLimit').value = example.bankLimit;

            // Update risk level display
            riskValueSpan.textContent = example.riskLevel;

            // Toggle industry field based on borrower type
            const isBusiness = example.borrowerType === 'business';
            industryInput.disabled = !isBusiness;
            if (isBusiness && example.industry) {
                industryInput.value = example.industry;
            } else {
                industryInput.value = '';
            }

            // Scroll to top of form
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Add event listeners to example buttons
        document.getElementById('example1Btn').addEventListener('click', (e) => {
            e.preventDefault();
            loadExample('example1');
        });

        document.getElementById('example2Btn').addEventListener('click', (e) => {
            e.preventDefault();
            loadExample('example2');
        });

        document.getElementById('example3Btn').addEventListener('click', (e) => {
            e.preventDefault();
            loadExample('example3');
        });
    </script>
</body>
</html>
